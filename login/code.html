<!DOCTYPE html>

<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>سحاب IPTV - تسجيل الدخول والتثبيت</title>
<!-- Tailwind CSS v3 with forms and container-queries plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Cairo -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          deepblue: "#0B0F24",
          royal: "#8E45FF",
          glow: "#7DC4FF",
          live: "#E53935",
          gold: "#E0A23B"
        }
      }
    }
  }
</script>
<style data-purpose="custom-theme">
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #0B0F24;
      color: #ffffff;
      overflow: hidden;
      user-select: none;
    }
    .glass-panel {
      background: rgba(18, 18, 45, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glass-panel-active, .tv-focus:focus, .tv-focus:hover {
      background: linear-gradient(90deg, rgba(142, 69, 255, 0.45) 0%, rgba(11, 15, 36, 0.9) 100%);
      backdrop-filter: blur(20px);
      border: 2px solid #7DC4FF;
      box-shadow: 0 0 30px rgba(125, 196, 255, 0.5);
      outline: none;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(142, 69, 255, 0.6);
      border-radius: 4px;
    }
  </style>
<meta content="web_dashboard" name="shell-type"/>
</head>
<body class="h-screen w-screen flex flex-col justify-between relative bg-[#0B0F24]">
<!-- Cosmic Background with glowing earth map effect -->
<div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
<div class="absolute -top-[30%] -right-[10%] w-[70%] h-[70%] rounded-full bg-gradient-to-b from-[#7DC4FF]/20 via-royal/15 to-transparent blur-3xl opacity-70"></div>
<div class="absolute top-1/4 left-1/4 w-[600px] h-[600px] rounded-full bg-radial from-glow/15 to-transparent blur-[120px]"></div>
<div class="absolute -bottom-20 -left-20 w-[500px] h-[500px] rounded-full bg-royal/15 blur-[150px]"></div>
</div>
<!-- Top Minimal Bar -->
<header class="relative z-10 flex items-center justify-between px-10 pt-6 pb-2" data-purpose="top-navigation">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-royal to-blue-600 flex items-center justify-center shadow-lg shadow-royal/40 border border-[#7DC4FF]/30">
<svg class="w-7 h-7 text-white fill-current" viewbox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4 0-2.05 1.53-3.76 3.56-3.97l1.07-.11.5-.95C8.08 7.14 9.94 6 12 6c2.62 0 4.88 1.86 5.39 4.43l.3 1.5 1.53.11c1.56.1 2.78 1.41 2.78 2.96 0 1.65-1.35 3-3 3z"></path></svg>
</div>
<div>
<h1 class="text-xl font-black tracking-wider bg-gradient-to-r from-white via-glow to-royal bg-clip-text text-transparent">سحاب IPTV</h1>
<p class="text-xs text-gray-400">إعداد الجهاز الأول</p>
</div>
</div>
<div class="flex items-center gap-4">
<div class="glass-panel px-4 py-2 rounded-full flex items-center gap-3 text-xs font-semibold text-gray-200">
<span>09:41 PM</span>
<span class="w-1.5 h-1.5 rounded-full bg-glow"></span>
<span class="text-glow">الإصدار 3.2.1-VIP</span>
</div>
</div>
</header>
<!-- Main Center Setup & Login Container -->
<main class="relative z-10 px-8 flex-1 flex items-center justify-center overflow-y-auto py-2" data-purpose="setup-login-container">
<div class="w-full max-w-5xl mx-auto glass-panel p-8 lg:p-10 rounded-3xl shadow-2xl border border-white/10 flex flex-col items-center relative backdrop-blur-2xl">
<!-- Central Header & Logo -->
<div class="flex flex-col items-center text-center mb-8">
<div class="w-20 h-20 rounded-3xl bg-gradient-to-br from-royal via-blue-600 to-glow flex items-center justify-center shadow-xl shadow-royal/60 border border-glow/40 mb-4 relative group">
<div class="absolute inset-0 rounded-3xl bg-royal/60 blur-xl animate-pulse"></div>
<svg class="w-10 h-10 text-white fill-current relative z-10 transform scale-110" viewbox="0 0 24 24">
<path d="M8 5v14l11-7z"></path>
</svg>
</div>
<h2 class="text-3xl font-black text-white tracking-wide bg-gradient-to-r from-white via-glow to-royal bg-clip-text text-transparent mb-2">
        مرحباً بك في منصة سحاب - البث التلفزيوني الذكي للشاشات الكبيرة
      </h2>
<p class="text-gray-300 text-sm max-w-xl">
        يرجى إدخال بيانات الاشتراك الخاصة بك أو استخدام خيارات التنشيط السريع للبدء في الاستمتاع بآلاف القنوات والأفلام والمسلسلات.
      </p>
</div>
<!-- Login Form Grid -->
<form class="w-full grid grid-cols-1 md:grid-cols-3 gap-6 mb-8" onsubmit="event.preventDefault();">
<!-- Server URL Input -->
<div class="flex flex-col gap-2.5">
<label class="text-sm font-bold text-gray-200 flex items-center gap-2">
<span class="w-2.5 h-2.5 rounded-full bg-glow"></span>
          رابط الخادم (Server URL)
        </label>
<div class="relative">
<input class="w-full px-4 py-4 rounded-2xl bg-surface-container/70 border border-outline-variant/50 text-white placeholder-gray-500 text-sm tv-focus transition focus:border-glow focus:ring-2 focus:ring-glow/20 outline-none text-right font-medium" placeholder="http://portal.server.com:8080" type="text"/>
<div class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</div>
</div>
</div>
<!-- Username Input -->
<div class="flex flex-col gap-2.5">
<label class="text-sm font-bold text-gray-200 flex items-center gap-2">
<span class="w-2.5 h-2.5 rounded-full bg-royal"></span>
          اسم المستخدم (Username)
        </label>
<div class="relative">
<input class="w-full px-4 py-4 rounded-2xl bg-surface-container/70 border border-outline-variant/50 text-white placeholder-gray-500 text-sm tv-focus transition focus:border-glow focus:ring-2 focus:ring-glow/20 outline-none text-right font-medium" placeholder="أدخل اسم المستخدم" type="text"/>
<div class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</div>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2.5">
<label class="text-sm font-bold text-gray-200 flex items-center gap-2">
<span class="w-2.5 h-2.5 rounded-full bg-gold"></span>
          كلمة المرور (Password)
        </label>
<div class="relative">
<input class="w-full px-4 py-4 rounded-2xl bg-surface-container/70 border border-outline-variant/50 text-white placeholder-gray-500 text-sm tv-focus transition focus:border-glow focus:ring-2 focus:ring-glow/20 outline-none text-right font-medium" placeholder="••••••••" type="password"/>
<div class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</div>
</div>
</div>
</form>
<!-- Action Bar & Additional Cards -->
<div class="w-full flex flex-col md:flex-row items-center justify-between gap-4 pt-2">
<!-- Activation Code Card / Trial -->
<div class="flex items-center gap-3 w-full md:w-auto">
<button class="glass-panel px-5 py-3.5 rounded-2xl flex items-center gap-3 tv-focus transition hover:border-glow/50 border border-white/10 group">
<div class="w-9 h-9 rounded-xl bg-gold/20 border border-gold/40 flex items-center justify-center text-gold">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z" stroke-linecap="round" stroke-linejoin="round5" stroke-width="2"></path></svg>
</div>
<div class="text-right">
<span class="block text-xs font-bold text-white group-hover:text-glow transition">تنشيط جهاز جديد (Activation Code)</span>
<span class="text-[11px] text-gray-400">ربط الجهاز عبر رمز التفعيل السريع</span>
</div>
</button>
</div>
<!-- Submit Button -->
<button class="w-full md:w-auto px-10 py-4 rounded-2xl bg-gradient-to-r from-royal via-blue-600 to-royal text-white font-bold text-base tracking-wide shadow-xl shadow-royal/50 border border-glow/40 tv-focus transition hover:scale-105 active:scale-95 flex items-center justify-center gap-3" type="submit">
<span>تسجيل الدخول والتثبيت</span>
<svg class="w-5 h-5 transform rotate-180" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</button>
</div>
</div>
</main>
<!-- Bottom Navigation & Support Footer -->
<footer class="relative z-10 px-8 pb-6 pt-2" data-purpose="bottom-footer-bar">
<div class="glass-panel rounded-2xl p-4 flex flex-col md:flex-row items-center justify-between gap-4 border border-white/10">
<div class="flex items-center gap-3">
<div class="w-3 h-3 rounded-full bg-emerald-400 animate-ping"></div>
<span class="text-xs font-bold text-emerald-400">متصل بالخادم الرئيسي - جاهز للتشغيل</span>
</div>
<div class="flex items-center gap-3">
<button class="px-4 py-2 rounded-xl bg-white/5 border border-white/10 text-xs font-semibold text-gray-200 tv-focus transition hover:bg-white/10 flex items-center gap-2">
<svg class="w-4 h-4 text-glow" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
<span>تغيير اللغة (Language)</span>
</button>
<button class="px-4 py-2 rounded-xl bg-white/5 border border-white/10 text-xs font-semibold text-gray-200 tv-focus transition hover:bg-white/10 flex items-center gap-2">
<svg class="w-4 h-4 text-royal" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
<span>إعدادات النظام</span>
</button>
<button class="px-4 py-2 rounded-xl bg-white/5 border border-white/10 text-xs font-semibold text-gray-200 tv-focus transition hover:bg-white/10 flex items-center gap-2">
<svg class="w-4 h-4 text-gold" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
<span>الدعم الفني والاتصال</span>
</button>
</div>
</div>
</footer>
</body></html>
