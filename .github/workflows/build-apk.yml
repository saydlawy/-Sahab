name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release-keystore.jks

      - name: Run unit tests
        run: gradle :app:testReleaseUnitTest --no-daemon --stacktrace

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify Signature
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | head -1)
          $APKSIGNER verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" Sahab.apk
          ls -la Sahab.apk

      - name: Publish to the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Sahab.apk \
            --title "سحاب — أحدث نسخة (build ${{ github.run_number }})" \
            --notes "ملف التثبيت: Sahab.apk — رقم البناء ${{ github.run_number }}" \
            --target "${{ github.sha }}" \
            --latest

      - name: Prepare Firebase Service Account
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if echo "$FIREBASE_SERVICE_ACCOUNT" | grep -q '^{'; then
            echo "$FIREBASE_SERVICE_ACCOUNT" > firebase-service-account.json
          else
            echo "$FIREBASE_SERVICE_ACCOUNT" | base64 -d > firebase-service-account.json
          fi

      - name: Upload APK to Firebase App Distribution
        if: env.FIREBASE_APP_ID != '' && env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFile: firebase-service-account.json
          groups: testers
          file: Sahab.apk
          releaseNotes: "سحاب — بناء ${{ github.run_number }} (${{ github.sha }})"
