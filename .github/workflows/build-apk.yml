name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  security-events: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # @v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # @v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # @v4
        with:
          gradle-version: "9.3.1"

      # Detect project configuration
      - name: Detect Android project
        run: |
          test -f app/build.gradle || test -f app/build.gradle.kts
          echo "Android project detected"

      # Security: Scan repository for exposed secrets
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # @v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dependency vulnerability scanning
      - name: Dependency vulnerability scan
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c # @main
        continue-on-error: true
        with:
          project: Sahab
          path: .
          format: HTML
          out: reports
          args: >
            --enableRetired

      - name: Create google-services.json from Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Validate google-services.json
        run: |
          test -s app/google-services.json
          python3 -c "import json; d = json.load(open('app/google-services.json', encoding='utf-8')); assert 'client' in d and len(d['client']) > 0"
          echo "google-services.json validated ($(wc -c < app/google-services.json) bytes)"

      # Firebase dependency diagnostics
      - name: Diagnose Firebase dependencies
        run: |
          gradle :app:dependencyInsight --configuration releaseRuntimeClasspath --dependency firebase-installations
          gradle :app:dependencyInsight --configuration releaseRuntimeClasspath --dependency firebase-common
          gradle :app:dependencyInsight --configuration releaseRuntimeClasspath --dependency firebase-appdistribution
        continue-on-error: true

      # Android Lint
      - name: Run Android Lint
        run: gradle :app:lintRelease --no-daemon --stacktrace

      # Unit tests
      - name: Run unit tests
        run: gradle :app:testReleaseUnitTest --no-daemon --stacktrace

      # Build release APK
      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release-keystore.jks
          test -s release-keystore.jks
          gradle :app:assembleRelease --no-daemon --stacktrace

      # Verify APK exists
      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -n "$APK"
          test -s "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      # Verify signature
      - name: Verify Signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      # Prepare APK
      - name: Prepare APK
        run: |
          cp "$APK" Sahab.apk
          ls -lh Sahab.apk

      # Upload test and scan reports
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # @v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/
            app/build/test-results/
            reports/
          if-no-files-found: warn
          retention-days: 14

      # Publish latest release
      - name: Publish to the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Sahab.apk \
            --title "سحاب — أحدث نسخة (build ${{ github.run_number }})" \
            --notes "ملف التثبيت: Sahab.apk — رقم البناء ${{ github.run_number }}" \
            --target "${{ github.sha }}" \
            --latest

      # Prepare Firebase Service Account
      - name: Prepare Firebase Service Account
        id: firebase_sa
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] || [ -z "$FIREBASE_APP_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | grep -q '^{'; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > firebase-service-account.json
          else
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | base64 -d > firebase-service-account.json
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # Upload to Firebase
      - name: Upload APK to Firebase App Distribution
        if: steps.firebase_sa.outputs.ready == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@bd494989dd4bec0343f78adee87fe66e48279ad6 # @v1
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFile: firebase-service-account.json
          groups: testers
          file: Sahab.apk
          releaseNotes: "سحاب — بناء ${{ github.run_number }} (${{ github.sha }})"