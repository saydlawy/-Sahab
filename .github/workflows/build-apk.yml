name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  security-events: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # Detect project configuration
      - name: Detect Android project
        run: |
          test -f app/build.gradle || test -f app/build.gradle.kts
          echo "Android project detected"

      # Security: Scan repository for exposed secrets
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dependency vulnerability scanning
      - name: Dependency vulnerability scan
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true
        with:
          project: Sahab
          path: .
          format: HTML
          out: reports
          args: >
            --enableRetired          echo "✅ File created. Size: $(wc -c < app/google-services.json) bytes"

      - name: Create google-services.json from Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          echo "✅ File created. Size: $(wc -c < app/google-services.json) bytes"

      # Firebase dependency diagnostics
      - name: Diagnose Firebase dependencies
        run: |
          gradle :app:dependencyInsight --configuration releaseRuntimeClasspath --dependency firebase-installations
          gradle :app:dependencyInsight --configuration releaseRuntimeClasspath --dependency firebase-common
          gradle :app:dependencyInsight --configuration releaseRuntimeClasspath --dependency firebase-appdistribution
        continue-on-error: true

      # Android Lint
      - name: Run Android Lint
        run: gradle :app:lintRelease --no-daemon --stacktrace

      # Unit tests
      - name: Run unit tests
        run: gradle :app:testReleaseUnitTest --no-daemon --stacktrace

      # Build release APK
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release-keystore.jks
          gradle :app:assembleRelease --no-daemon --stacktrace

      # Verify APK exists
      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -n "$APK"
          test -s "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      # Verify signature
      - name: Verify Signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      # Prepare APK
      - name: Prepare APK
        run: |
          cp "$APK" Sahab.apk
          ls -lh Sahab.apk

      # Upload test and scan reports
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/
            app/build/test-results/
            reports/
          if-no-files-found: warn
          retention-days: 14

      # Publish latest release
      - name: Publish to the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Sahab.apk \
            --title "سحاب — أحدث نسخة (build ${{ github.run_number }})" \
            --notes "ملف التثبيت: Sahab.apk — رقم البناء ${{ github.run_number }}" \
            --target "${{ github.sha }}" \
            --latest

      # Prepare Firebase Service Account
      - name: Prepare Firebase Service Account
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if echo "$FIREBASE_SERVICE_ACCOUNT" | grep -q '^{'; then
            echo "$FIREBASE_SERVICE_ACCOUNT" > firebase-service-account.json
          else
            echo "$FIREBASE_SERVICE_ACCOUNT" | base64 -d > firebase-service-account.json
          fi

      # Upload to Firebase
      - name: Upload APK to Firebase App Distribution
        if: env.FIREBASE_APP_ID != '' && env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFile: firebase-service-account.json
          groups: testers
          file: Sahab.apk
          releaseNotes: "سحاب — بناء ${{ github.run_number }} (${{ github.sha }})"